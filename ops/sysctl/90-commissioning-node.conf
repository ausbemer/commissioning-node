# Installed by ops/install.sh to /etc/sysctl.d/ (ADR-0005 A3).
# IPv4 forwarding, so the node can serve the site network to the tailnet as a subnet router.
# The `inet commissioning_node` firewall's forward chain lets only the tailnet open forwarded
# connections; the installer loads it before this is applied.
# IPv6 forwarding stays off: it would stop the kernel accepting router advertisements.
net.ipv4.ip_forward = 1
