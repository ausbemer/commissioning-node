# DKMS package for the mainline kvaser_usb SocketCAN driver (ADR-0010 D6). install.sh fills
# @VERSION@ from pins.sh (KVASER_USB_SRC_TAG without the "v") and puts this file beside the
# pinned, sha256-checked upstream sources in /usr/src/kvaser_usb-@VERSION@/. DKMS rebuilds
# the module for every new kernel. The upstream Makefile is kept as-is: its object is
# obj-$(CONFIG_CAN_KVASER_USB), so the build sets that to m.
PACKAGE_NAME="kvaser_usb"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="kvaser_usb"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build CONFIG_CAN_KVASER_USB=m modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
